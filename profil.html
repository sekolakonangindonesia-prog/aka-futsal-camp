<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Peserta — AKA Futsal Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120e0c; --surface:#1d1613; --surface-2:#261c17; --line:#3a2b23;
    --amber:#e8b923; --red:#c8272d; --chalk:#f5f1e8; --text-secondary:#a89586;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--chalk);font-family:'Manrope',sans-serif;min-height:100vh;padding:20px 16px 60px;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;margin:0;}
  .wrap{max-width:480px;margin:0 auto;}
  .back-link{display:inline-block;margin-bottom:16px;color:var(--text-secondary);text-decoration:none;font-size:13px;}
  .back-link:hover{color:var(--amber);}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .topbar img{width:32px;height:32px;object-fit:contain;}
  .topbar .club-name{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--text-secondary);text-transform:uppercase;}

  .card{
    background:linear-gradient(165deg, var(--surface-2) 0%, var(--surface) 55%, #170f0c 100%);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    position:relative;
    min-height:440px;
  }
  .rank-flag{position:absolute;top:14px;right:14px;background:rgba(232,185,35,0.18);border:1px solid var(--amber);color:var(--amber);font-family:'Space Mono',monospace;font-size:10px;padding:4px 10px;border-radius:20px;z-index:3;}

  .photo-bg{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;
    animation: fadeInPhoto .8s ease-out;
  }
  .photo-initial{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-size:64px;color:var(--amber);background:var(--surface-2);
  }
  @keyframes fadeInPhoto{ from{opacity:0;transform:scale(1.03);} to{opacity:1;transform:scale(1);} }

  .shade-right{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg, transparent 0%, transparent 48%, rgba(15,11,9,0.5) 60%, rgba(15,11,9,0.86) 72%, rgba(15,11,9,0.96) 100%);
  }

  .info-col{
    position:absolute;top:0;right:0;bottom:0;z-index:2;
    width:40%;
    display:flex;flex-direction:column;justify-content:center;gap:8px;
    padding:18px 14px 18px 8px;
  }
  .name-block h1{font-size:16px;letter-spacing:.2px;line-height:1.18;text-shadow:0 2px 10px rgba(0,0,0,0.7);word-break:break-word;}
  .name-block .sub{font-family:'Manrope',sans-serif;font-style:italic;font-size:10px;color:var(--text-secondary);margin-top:3px;letter-spacing:.2px;}

  .total-band{background:rgba(232,185,35,0.94);color:#1a1310;padding:8px 10px;border-radius:7px;font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.6px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
  .total-band strong{font-size:15px;}
  .avg-band{background:rgba(139,101,54,0.35);color:var(--chalk);padding:6px 10px;border-radius:7px;font-family:'Oswald',sans-serif;font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-top:-3px;}
  .avg-band strong{font-family:'Space Mono',monospace;font-size:12px;color:var(--amber);}

  .stat-list{display:flex;flex-direction:column;gap:3px;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:6px 9px;font-size:10px;background:rgba(139,101,54,0.28);border-radius:6px;}
  .stat-row:nth-child(odd){background:rgba(101,71,36,0.4);}
  .stat-row .label{color:#e6d9c6;text-transform:uppercase;font-size:8.5px;letter-spacing:.2px;}
  .stat-row .value{font-family:'Space Mono',monospace;font-weight:700;color:var(--chalk);font-size:12px;flex-shrink:0;}
  @media (max-width:360px){
    .info-col{width:46%;padding:14px 10px 14px 6px;}
    .name-block h1{font-size:14px;}
    .stat-row{font-size:9px;padding:5px 7px;}
  }

  .bulan-picker{display:flex;justify-content:center;margin-top:18px;}
  .bulan-picker select{background:var(--surface);border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:9px 14px;font-family:'Manrope',sans-serif;font-size:12px;}

  .loading, .empty-msg{text-align:center;color:var(--text-secondary);font-size:13px;padding:60px 16px;}
  .footer-note{text-align:center;color:var(--text-secondary);font-size:10.5px;margin-top:26px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase;}

  .stat-row{cursor:pointer;}
  .stat-row:active{opacity:0.7;}
  .sub-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:30;align-items:flex-end;justify-content:center;}
  .sub-overlay.active{display:flex;}
  .sub-modal{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:20px 18px 26px;max-height:70vh;overflow-y:auto;}
  @media (min-width:480px){ .sub-overlay{align-items:center;} .sub-modal{border-radius:16px;} }
  .sub-modal h3{font-family:'Oswald',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.5px;margin:0 0 4px;color:var(--amber);}
  .sub-modal .sub-modal-total{font-size:12px;color:var(--text-secondary);margin-bottom:14px;}
  .sub-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-size:13px;}
  .sub-item:nth-child(odd){background:rgba(232,185,35,0.06);}
  .sub-item .label{color:var(--text-secondary);}
  .sub-item .value{font-family:'Space Mono',monospace;font-weight:700;color:var(--chalk);}
  .sub-modal-close{display:block;width:100%;margin-top:16px;background:var(--amber);color:#1a1310;border:none;border-radius:8px;padding:11px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Kembali</a>
  <div class="topbar">
    <img src="aka%20futsal%20camp.png" alt="AKA Futsal Camp">
    <span class="club-name">AKA Futsal Camp &middot; Profil Peserta</span>
  </div>

  <div id="content"><div class="loading">Memuat profil...</div></div>

  <div class="footer-note">AKA Futsal Camp &middot; Update Otomatis</div>
</div>

<div class="sub-overlay" id="subOverlay">
  <div class="sub-modal">
    <h3 id="subModalTitle">Kategori</h3>
    <div class="sub-modal-total" id="subModalTotal"></div>
    <div id="subModalList"></div>
    <button class="sub-modal-close" id="subModalClose">Tutup</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCWg3d1qtHFEwsN-GLakSDIvb-Wjbo7cIQ",
    authDomain: "aka-futsal-camp.firebaseapp.com",
    projectId: "aka-futsal-camp",
    storageBucket: "aka-futsal-camp.firebasestorage.app",
    messagingSenderId: "721774551002",
    appId: "1:721774551002:web:bcd2e47b06d61daf626ae3"
  };
  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (err) {
    console.error('Firebase gagal dimuat:', err);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  const params = new URLSearchParams(window.location.search);
  const siswaId = params.get('id');

  let siswaData = null;
  let kriteriaLabelMap = {};
  let kriteriaFull = [];
  let penilaianList = [];

  function bulanLabel(bulan) {
    if (!bulan) return '';
    const [y, m] = bulan.split('-');
    const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return (namaBulan[Number(m) - 1] || '') + ' ' + y;
  }

  async function computeRankAndAverage(bulan) {
    if (!bulan) return { rank: null, average: null };
    try {
      const snap = await db.collection('penilaian').where('bulan', '==', bulan).get();
      const list = snap.docs.map(d => d.data()).sort((a, b) => (b.total || 0) - (a.total || 0));
      const idx = list.findIndex(p => p.siswa_id === siswaId);
      const average = list.length ? list.reduce((sum, p) => sum + (p.total || 0), 0) / list.length : null;
      return { rank: idx === -1 ? null : idx + 1, average };
    } catch (err) {
      return { rank: null, average: null };
    }
  }

  async function renderProfile(nilai) {
    const content = document.getElementById('content');
    const foto = siswaData.foto_profil || siswaData.foto;
    const nama = siswaData.nama || '-';
    let rank = null;
    let average = null;
    if (nilai) {
      const res = await computeRankAndAverage(nilai.bulan);
      rank = res.rank;
      average = res.average;
    }

    const bulanOptions = penilaianList.map(p =>
      `<option value="${escapeHtml(p.bulan)}" ${nilai && p.bulan === nilai.bulan ? 'selected' : ''}>${escapeHtml(bulanLabel(p.bulan))}</option>`
    ).join('');

    let statRows = '';
    if (nilai && nilai.kategoriTotal) {
      statRows = Object.keys(nilai.kategoriTotal).map(key =>
        `<div class="stat-row" data-kat="${escapeHtml(key)}"><span class="label">${escapeHtml(kriteriaLabelMap[key] || key)}</span><span class="value">${nilai.kategoriTotal[key]}</span></div>`
      ).join('');
    }

    content.innerHTML = `
      <div class="card">
        ${foto ? `<img class="photo-bg" src="${foto}" alt="">` : `<div class="photo-initial">${escapeHtml(nama.charAt(0).toUpperCase())}</div>`}
        <div class="shade-right"></div>
        ${rank ? `<div class="rank-flag">#${rank}</div>` : ''}
        <div class="info-col">
          <div class="name-block">
            <h1>${escapeHtml(nama)}</h1>
            <div class="sub">${siswaData.usia ? siswaData.usia + ' Tahun' : ''}${siswaData.kelas ? ' &middot; ' + escapeHtml(siswaData.kelas) : ''}</div>
          </div>
          ${nilai ? `
            <div class="total-band"><span>Total Poin</span><strong>${nilai.total || 0}</strong></div>
            ${average !== null ? `<div class="avg-band"><span>Rata-rata Peserta</span><strong>${average.toFixed(1)}</strong></div>` : ''}
            <div class="stat-list">${statRows}</div>
          ` : `
            <div class="total-band" style="background:rgba(90,90,90,0.85);color:var(--chalk);"><span>Belum ada penilaian</span></div>
          `}
        </div>
      </div>
      ${penilaianList.length > 1 ? `<div class="bulan-picker"><select id="bulanSelect">${bulanOptions}</select></div>` : ''}
    `;

    const sel = document.getElementById('bulanSelect');
    if (sel) {
      sel.addEventListener('change', () => {
        const chosen = penilaianList.find(p => p.bulan === sel.value);
        renderProfile(chosen);
      });
    }

    content.querySelectorAll('.stat-row[data-kat]').forEach(row => {
      row.addEventListener('click', () => bukaSubModal(row.dataset.kat, nilai));
    });
  }

  function bukaSubModal(katKey, nilai) {
    const kat = kriteriaFull.find(k => k.key === katKey);
    if (!kat) return;
    document.getElementById('subModalTitle').textContent = kat.label;
    const totalKat = nilai.kategoriTotal && nilai.kategoriTotal[katKey] !== undefined ? nilai.kategoriTotal[katKey] : '-';
    document.getElementById('subModalTotal').textContent = 'Total ' + kat.label + ': ' + totalKat;

    const listEl = document.getElementById('subModalList');
    const subs = kat.subs || [];
    if (subs.length === 0) {
      listEl.innerHTML = '<div class="empty-msg" style="padding:20px 0;">Belum ada rincian sub-kriteria.</div>';
    } else {
      listEl.innerHTML = subs.map(sub => {
        const nilaiSub = nilai.detailPoin && nilai.detailPoin[katKey] && nilai.detailPoin[katKey][sub.key] !== undefined
          ? nilai.detailPoin[katKey][sub.key] : '-';
        return `<div class="sub-item"><span class="label">${escapeHtml(sub.label)}</span><span class="value">${nilaiSub}</span></div>`;
      }).join('');
    }
    document.getElementById('subOverlay').classList.add('active');
  }

  document.getElementById('subModalClose').addEventListener('click', () => {
    document.getElementById('subOverlay').classList.remove('active');
  });
  document.getElementById('subOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'subOverlay') document.getElementById('subOverlay').classList.remove('active');
  });

  async function init() {
    const content = document.getElementById('content');
    if (!siswaId) { content.innerHTML = '<div class="empty-msg">Profil tidak ditemukan.</div>'; return; }
    if (!db) { content.innerHTML = '<div class="empty-msg">Koneksi data tidak tersedia.</div>'; return; }
    try {
      const [siswaDoc, kriteriaDoc, penilaianSnap] = await Promise.all([
        db.collection('futsal_siswa').doc(siswaId).get(),
        db.collection('penilaian_kriteria').doc('config').get(),
        db.collection('penilaian').where('siswa_id', '==', siswaId).get()
      ]);
      if (!siswaDoc.exists) { content.innerHTML = '<div class="empty-msg">Peserta tidak ditemukan.</div>'; return; }
      siswaData = siswaDoc.data();
      if (kriteriaDoc.exists) {
        kriteriaFull = kriteriaDoc.data().kategori || [];
        kriteriaFull.forEach(kat => { kriteriaLabelMap[kat.key] = kat.label; });
      }
      penilaianList = penilaianSnap.docs.map(d => d.data()).sort((a, b) => (b.bulan || '').localeCompare(a.bulan || ''));
      renderProfile(penilaianList[0] || null);
    } catch (err) {
      console.error(err);
      content.innerHTML = '<div class="empty-msg">Gagal memuat profil: ' + err.message + '</div>';
    }
  }

  init();
</script>
</body>
</html>
