<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Peserta — AKA Futsal Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120e0c; --surface:#1d1613; --surface-2:#261c17; --line:#3a2b23;
    --amber:#e8b923; --red:#c8272d; --chalk:#f5f1e8; --text-secondary:#a89586;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--chalk);font-family:'Manrope',sans-serif;min-height:100vh;padding:20px 16px 60px;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;margin:0;}
  .wrap{max-width:480px;margin:0 auto;}
  .back-link{display:inline-block;margin-bottom:16px;color:var(--text-secondary);text-decoration:none;font-size:13px;}
  .back-link:hover{color:var(--amber);}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .topbar img{width:32px;height:32px;object-fit:contain;}
  .topbar .club-name{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--text-secondary);text-transform:uppercase;}

  .card{
    background:linear-gradient(165deg, var(--surface-2) 0%, var(--surface) 55%, #170f0c 100%);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    position:relative;
    display:flex;
    min-height:340px;
  }
  .card-badge{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;z-index:3;}
  .card-badge img{width:22px;height:22px;object-fit:contain;}
  .card-badge span{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--amber);text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
  .rank-flag{position:absolute;top:12px;right:12px;background:rgba(232,185,35,0.15);border:1px solid var(--amber);color:var(--amber);font-family:'Space Mono',monospace;font-size:10px;padding:4px 9px;border-radius:20px;z-index:3;}

  .photo-col{
    width:38%;flex-shrink:0;position:relative;background:var(--surface-2);
    animation: fadeInLeft .7s ease-out;
  }
  .photo-col img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;}
  .photo-initial{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-size:52px;color:var(--amber);
  }
  .photo-col::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg, transparent 70%, var(--surface) 100%);pointer-events:none;}
  @keyframes fadeInLeft{ from{opacity:0;transform:translateX(-14px);} to{opacity:1;transform:translateX(0);} }

  .info-col{flex:1;display:flex;flex-direction:column;min-width:0;}
  .name-block{padding:16px 16px 12px;}
  .name-block h1{font-size:19px;letter-spacing:.3px;line-height:1.1;}
  .name-block .sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-secondary);margin-top:6px;letter-spacing:.5px;text-transform:uppercase;}

  .total-band{background:var(--amber);color:#1a1310;padding:10px 16px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
  .total-band strong{font-size:18px;}

  .stat-list{padding:2px 0;flex:1;}
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-size:12px;}
  .stat-row:nth-child(odd){background:rgba(232,185,35,0.05);}
  .stat-row .label{color:var(--text-secondary);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;}
  .stat-row .value{font-family:'Space Mono',monospace;font-weight:700;color:var(--chalk);font-size:14px;}
  @media (max-width:380px){
    .name-block h1{font-size:16px;}
    .stat-row{padding:8px 12px;font-size:11px;}
  }

  .bulan-picker{display:flex;justify-content:center;margin-top:18px;}
  .bulan-picker select{background:var(--surface);border:1px solid var(--line);color:var(--chalk);border-radius:8px;padding:9px 14px;font-family:'Manrope',sans-serif;font-size:12px;}

  .loading, .empty-msg{text-align:center;color:var(--text-secondary);font-size:13px;padding:60px 16px;}
  .footer-note{text-align:center;color:var(--text-secondary);font-size:10.5px;margin-top:26px;font-family:'Space Mono',monospace;letter-spacing:1px;text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Kembali</a>
  <div class="topbar">
    <img src="aka%20futsal%20camp.png" alt="AKA Futsal Camp">
    <span class="club-name">AKA Futsal Camp &middot; Profil Peserta</span>
  </div>

  <div id="content"><div class="loading">Memuat profil...</div></div>

  <div class="footer-note">AKA Futsal Camp &middot; Update Otomatis</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCWg3d1qtHFEwsN-GLakSDIvb-Wjbo7cIQ",
    authDomain: "aka-futsal-camp.firebaseapp.com",
    projectId: "aka-futsal-camp",
    storageBucket: "aka-futsal-camp.firebasestorage.app",
    messagingSenderId: "721774551002",
    appId: "1:721774551002:web:bcd2e47b06d61daf626ae3"
  };
  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (err) {
    console.error('Firebase gagal dimuat:', err);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  const params = new URLSearchParams(window.location.search);
  const siswaId = params.get('id');

  let siswaData = null;
  let kriteriaLabelMap = {};
  let penilaianList = [];

  function bulanLabel(bulan) {
    if (!bulan) return '';
    const [y, m] = bulan.split('-');
    const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return (namaBulan[Number(m) - 1] || '') + ' ' + y;
  }

  async function computeRank(bulan) {
    if (!bulan) return null;
    try {
      const snap = await db.collection('penilaian').where('bulan', '==', bulan).get();
      const list = snap.docs.map(d => d.data()).sort((a, b) => (b.total || 0) - (a.total || 0));
      const idx = list.findIndex(p => p.siswa_id === siswaId);
      return idx === -1 ? null : idx + 1;
    } catch (err) {
      return null;
    }
  }

  async function renderProfile(nilai) {
    const content = document.getElementById('content');
    const foto = siswaData.foto_profil || siswaData.foto;
    const nama = siswaData.nama || '-';
    let rank = nilai ? await computeRank(nilai.bulan) : null;

    const bulanOptions = penilaianList.map(p =>
      `<option value="${escapeHtml(p.bulan)}" ${nilai && p.bulan === nilai.bulan ? 'selected' : ''}>${escapeHtml(bulanLabel(p.bulan))}</option>`
    ).join('');

    let statRows = '';
    if (nilai && nilai.kategoriTotal) {
      statRows = Object.keys(nilai.kategoriTotal).map(key =>
        `<div class="stat-row"><span class="label">${escapeHtml(kriteriaLabelMap[key] || key)}</span><span class="value">${nilai.kategoriTotal[key]}</span></div>`
      ).join('');
    }

    content.innerHTML = `
      <div class="card">
        <div class="photo-col">
          ${foto ? `<img src="${foto}" alt="">` : `<div class="photo-initial">${escapeHtml(nama.charAt(0).toUpperCase())}</div>`}
          <div class="card-badge"><img src="aka%20futsal%20camp.png" alt=""><span>AKA</span></div>
          ${rank ? `<div class="rank-flag">#${rank}</div>` : ''}
        </div>
        <div class="info-col">
          <div class="name-block">
            <h1>${escapeHtml(nama)}</h1>
            <div class="sub">${siswaData.usia ? siswaData.usia + ' Tahun' : ''}${siswaData.kelas ? ' &middot; ' + escapeHtml(siswaData.kelas) : ''}${siswaData.sekolah ? ' &middot; ' + escapeHtml(siswaData.sekolah) : ''}</div>
          </div>
          ${nilai ? `
            <div class="total-band"><span>Total Poin</span><strong>${nilai.total || 0}</strong></div>
            <div class="stat-list">${statRows}</div>
          ` : `
            <div class="total-band" style="background:var(--surface-2);color:var(--text-secondary);"><span>Belum ada penilaian</span></div>
          `}
        </div>
      </div>
      ${penilaianList.length > 1 ? `<div class="bulan-picker"><select id="bulanSelect">${bulanOptions}</select></div>` : ''}
    `;

    const sel = document.getElementById('bulanSelect');
    if (sel) {
      sel.addEventListener('change', () => {
        const chosen = penilaianList.find(p => p.bulan === sel.value);
        renderProfile(chosen);
      });
    }
  }

  async function init() {
    const content = document.getElementById('content');
    if (!siswaId) { content.innerHTML = '<div class="empty-msg">Profil tidak ditemukan.</div>'; return; }
    if (!db) { content.innerHTML = '<div class="empty-msg">Koneksi data tidak tersedia.</div>'; return; }
    try {
      const [siswaDoc, kriteriaDoc, penilaianSnap] = await Promise.all([
        db.collection('futsal_siswa').doc(siswaId).get(),
        db.collection('penilaian_kriteria').doc('config').get(),
        db.collection('penilaian').where('siswa_id', '==', siswaId).get()
      ]);
      if (!siswaDoc.exists) { content.innerHTML = '<div class="empty-msg">Peserta tidak ditemukan.</div>'; return; }
      siswaData = siswaDoc.data();
      if (kriteriaDoc.exists) {
        (kriteriaDoc.data().kategori || []).forEach(kat => { kriteriaLabelMap[kat.key] = kat.label; });
      }
      penilaianList = penilaianSnap.docs.map(d => d.data()).sort((a, b) => (b.bulan || '').localeCompare(a.bulan || ''));
      renderProfile(penilaianList[0] || null);
    } catch (err) {
      console.error(err);
      content.innerHTML = '<div class="empty-msg">Gagal memuat profil: ' + err.message + '</div>';
    }
  }

  init();
</script>
</body>
</html>
